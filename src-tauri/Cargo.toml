[package]
name = "fidget"
version = "0.2.1"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rand = "0.9"
enigo = "0.6"
user-idle = "0.6"
tracing = { version = "0.1", features = ["log"] }
keepawake = "0.6.1"
tauri-plugin-store = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
tauri-plugin-log = "2"
sys-locale = "0.3.2"
tauri-plugin-updater = "2"

# Wayland: wlroots virtual-pointer protocol, and the XDG RemoteDesktop portal (GNOME/KDE, asks the user once).
# enigo picks the backend at runtime. Not compiled on macOS/Windows.
[target.'cfg(target_os = "linux")'.dependencies]
enigo = { version = "0.6", features = ["wayland", "libei_tokio"] }
